# Saves generated images into the repo when a Claude Code cloud session can't reach the image host.
# The session commits _tools/fetch-jobs.json (see _tools/fetch-images.mjs for the format) and pushes;
# this job downloads every image, converts it to WebP under 200 KB, builds the image ads, commits the
# files and removes the jobs file.
name: Fetch images
on:
  push:
    branches: [main]
    paths: ['_tools/fetch-jobs.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: fetch-images
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - name: Download and convert
        run: |
          [ -f _tools/fetch-jobs.json ] || { echo "No _tools/fetch-jobs.json"; exit 0; }
          echo "BRANCH=$(node -e "const j=require('./_tools/fetch-jobs.json');console.log(Array.isArray(j)?'':(j.branch||''))")" >> "$GITHUB_ENV"
          node _tools/fetch-images.mjs _tools/fetch-jobs.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$BRANCH" ]; then
            OUTS=$(node -e "require('./_tools/fetch-jobs.json').jobs.forEach(j=>console.log(j.out))")
            mkdir -p /tmp/fetched
            for f in $OUTS; do mkdir -p "/tmp/fetched/$(dirname "$f")"; cp "$f" "/tmp/fetched/$f"; rm -f "$f"; done
            git rm -q _tools/fetch-jobs.json
            git commit -q -m "Fetched files are on branch $BRANCH"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
            git checkout -q --orphan "$BRANCH"
            git rm -rq --cached . && git clean -fdq
            cp -r /tmp/fetched/. .
            git add -A
            git commit -q -m "Fetched files"
            git push -q -f origin "HEAD:$BRANCH"
          else
            git rm -q --ignore-unmatch _tools/fetch-jobs.json
            git add -A
            git diff --cached --quiet || git commit -m "Save fetched images"
            git pull --rebase -q origin main
            git push -q origin HEAD:main
          fi
